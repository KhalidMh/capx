name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --global @sap/cds-dk@^10 mbt
      - run: |
          echo "CAPX_REAL_CDS_DK_10=$(command -v cds)" >> "$GITHUB_ENV"
          echo "CAPX_REAL_MBT=$(command -v mbt)" >> "$GITHUB_ENV"
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run test:watch:required
      - run: npm run test:frontend:required
      - run: npm run test:mta:required
      - run: npm run test:vue-no-auth:required
      - run: npm run test:install-git:required
      - run: npm run test:docker:required
      - run: npm pack --dry-run --json
      - run: npm publish --dry-run
